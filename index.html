<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DermaPura Cosméticos — Beleza com Ciência e Conformidade</title>
<meta name="description" content="DermaPura Cosméticos: skincare e higiene pessoal produzidos sob Boas Práticas de Fabricação, validação de sistemas (CSV) e rastreabilidade de lote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#7a4d8c; --plum-d:#4a2c59; --plum-dd:#2e1a38; --lilac:#d9aee8;
    --petal:#f4eaf7; --soft:#faf6fb; --ink:#231a2a; --mut:#6c6173;
    --line:#e7dcec; --white:#ffffff; --ok:#2e9e6b;
    --shadow:0 10px 30px rgba(74,44,89,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:84px}
  body{background:var(--white);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
  .wrap{max-width:1160px;margin:0 auto;padding:0 28px}
  h1,h2,h3,.dsp{font-family:"Newsreader",Georgia,serif;font-weight:500;line-height:1.12}
  a{color:inherit;text-decoration:none}

  /* NAV */
  nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:76px}
  .brand{display:flex;align-items:center;gap:11px;font-family:"Newsreader",serif;font-size:1.35rem;color:var(--plum-d);font-weight:600}
  .brand svg{width:30px;height:30px;color:var(--plum)}
  .nav-links{display:flex;align-items:center;gap:30px;font-size:.9rem;font-weight:500;color:var(--mut)}
  .nav-links a:hover{color:var(--plum)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--plum);color:#fff;font-weight:600;font-size:.92rem;padding:14px 26px;border-radius:10px;transition:.2s;border:1px solid var(--plum)}
  .btn:hover{background:var(--plum-d);transform:translateY(-2px);box-shadow:var(--shadow)}
  .btn.sm{padding:10px 20px;font-size:.85rem}
  .btn.out{background:transparent;color:var(--plum)}
  .btn.out:hover{background:var(--petal);color:var(--plum-d)}
  @media(max-width:860px){.nav-links a:not(.btn){display:none}}

  /* HERO */
  header{position:relative;overflow:hidden;padding:96px 0 88px;background:linear-gradient(180deg,#fff 0%,var(--soft) 100%)}
  .ring{position:absolute;border:1px solid #e7d3ec;border-radius:50%;pointer-events:none}
  .r1{width:620px;height:620px;top:-240px;right:-200px}
  .r2{width:400px;height:400px;top:-130px;right:-100px;border-color:#efe0f2}
  .hero{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
  @media(max-width:960px){.hero{grid-template-columns:1fr}}
  .tag{display:inline-flex;align-items:center;gap:8px;color:var(--plum);background:var(--petal);font-weight:600;font-size:.78rem;letter-spacing:.06em;padding:8px 16px;border-radius:999px;margin-bottom:26px}
  .tag i{width:7px;height:7px;border-radius:50%;background:var(--plum);display:inline-block}
  header h1{font-size:clamp(2.6rem,5.6vw,4.4rem);color:var(--plum-dd)}
  header h1 em{color:var(--plum);font-style:italic}
  .lede{max-width:540px;margin:24px 0 34px;color:var(--mut);font-size:1.08rem}
  .actions{display:flex;flex-wrap:wrap;gap:14px}
  .trust{display:flex;flex-wrap:wrap;gap:22px;margin-top:38px;font-size:.84rem;color:var(--mut)}
  .trust span{display:flex;align-items:center;gap:8px}
  .trust svg{width:18px;height:18px;color:var(--plum)}

  /* PAINEL */
  .panel{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(74,44,89,.14);padding:26px}
  .panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.8rem;color:var(--mut);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .live{display:flex;align-items:center;gap:7px;color:var(--ok)}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:bl 1.6s infinite}
  @keyframes bl{50%{opacity:.35}}
  .kpi{padding:16px 0;border-top:1px solid var(--line)}
  .kpi:first-of-type{border-top:none;padding-top:0}
  .kpi-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .kpi-row span{font-size:.88rem;color:var(--mut)}
  .kpi-row b{font-family:"Newsreader",serif;font-size:1.6rem;color:var(--plum-d);font-weight:600}
  .bar{height:8px;border-radius:99px;background:var(--petal);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--plum),var(--lilac))}

  /* STATS */
  .stats{border-block:1px solid var(--line)}
  .stats .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
  .st{padding:34px 20px;text-align:center;border-right:1px solid var(--line)}
  .st:last-child{border-right:none}
  .st b{font-family:"Newsreader",serif;font-size:2.4rem;color:var(--plum-d);display:block;font-weight:600;line-height:1.1}
  .st small{color:var(--mut);font-size:.84rem}
  @media(max-width:820px){.stats .wrap{grid-template-columns:repeat(2,1fr)}.st:nth-child(2){border-right:none}.st:nth-child(-n+2){border-bottom:1px solid var(--line)}}

  /* SEÇÕES */
  section{padding:96px 0}
  .eyebrow{color:var(--plum);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem;margin-bottom:12px}
  h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:16px;color:var(--plum-dd)}
  .lead{color:var(--mut);max-width:660px;font-size:1.05rem}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:48px}
  @media(max-width:900px){.grid3{grid-template-columns:1fr}}
  .card{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:32px;transition:.25s}
  .card:hover{border-color:var(--plum);transform:translateY(-4px);box-shadow:var(--shadow)}
  .ico{width:46px;height:46px;border-radius:12px;background:var(--petal);color:var(--plum);display:grid;place-items:center;margin-bottom:18px}
  .ico svg{width:24px;height:24px}
  .card h3{font-size:1.28rem;margin-bottom:8px;color:var(--plum-d)}
  .card p{color:var(--mut);font-size:.95rem}

  /* QUALIDADE */
  #qual{background:var(--soft)}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
  @media(max-width:900px){.qgrid{grid-template-columns:1fr}}
  .checks{list-style:none;margin-top:22px}
  .checks li{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;color:var(--ink);font-size:.97rem}
  .checks li::before{content:"✓";color:#fff;background:var(--plum);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none;margin-top:2px}
  .steps{display:grid;gap:14px}
  .step{display:flex;gap:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;transition:.25s}
  .step:hover{border-color:var(--plum);box-shadow:var(--shadow)}
  .step b.n{font-family:"Newsreader",serif;font-size:1.7rem;color:var(--lilac);font-weight:600;line-height:1;min-width:34px}
  .step h3{font-size:1.1rem;color:var(--plum-d);margin-bottom:3px}
  .step p{color:var(--mut);font-size:.9rem}

  /* FÁBRICA */
  .fab{margin-top:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  @media(max-width:900px){.fab{grid-template-columns:1fr}}
  .big{background:linear-gradient(145deg,var(--plum-d),var(--plum-dd));color:#fff;border-radius:20px;padding:36px 32px}
  .big b{font-family:"Newsreader",serif;font-size:3rem;font-weight:500;color:var(--lilac);display:block;line-height:1}
  .big h3{font-size:1.15rem;margin:12px 0 6px}
  .big p{color:#cdbad6;font-size:.92rem}

  /* CTA */
  .cta-band{background:var(--petal);border-radius:26px;padding:56px;display:flex;flex-wrap:wrap;gap:26px;align-items:center;justify-content:space-between}
  .cta-band h2{margin-bottom:8px}
  @media(max-width:700px){.cta-band{padding:34px}}

  /* FOOTER */
  footer{background:var(--plum-dd);color:#d8cadf;padding:70px 0 0}
  .fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;padding-bottom:50px}
  @media(max-width:760px){.fgrid{grid-template-columns:1fr}}
  footer h4{font-family:"Newsreader",serif;color:var(--lilac);font-size:1.1rem;margin-bottom:14px;font-weight:500}
  footer p,footer a{display:block;font-size:.92rem;margin-bottom:8px;color:#c2b3cb}
  footer a:hover{color:#fff}
